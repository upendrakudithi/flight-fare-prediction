{% extends "base.html" %}

{% block title %}Login - Flight Price Predictor{% endblock %}

{% block additional_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <h1 class="auth-title">Login</h1>
    
    <form class="auth-form" method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit" class="auth-btn">Login</button>
    </form>
    
    <div class="auth-links">
        <a href="{{ url_for('signup') }}">Don't have an account? Sign up</a>
    </div>
    
    <div class="auth-separator">
        <span>or</span>
    </div>
    
    <div class="social-login">
        <button class="social-btn">
            <img src="{{ url_for('static', filename='images/google.png') }}" alt="Google">
            Login with Google
        </button>
    </div>
</div>
{% endblock %}
